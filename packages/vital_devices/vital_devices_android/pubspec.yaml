name: vital_devices_android
description: The Android implementation of Vital Devices.
version: 4.5.3
homepage: https://tryvital.io/
repository: https://github.com/tryVital/vital-flutter
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.5.0"

flutter:
  plugin:
    implements: vital_devices
    platforms:
      android:
        package: io.vital.devices
        pluginClass: VitalDevicesPlugin

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0
  vital_core:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_core/vital_core
  vital_devices_platform_interface:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_platform_interface
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  vital_core:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_core/vital_core
  vital_devices_platform_interface:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_platform_interface
