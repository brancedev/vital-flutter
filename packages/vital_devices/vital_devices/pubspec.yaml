name: vital_devices
description: The Vital Devices package allowing health devices to connect to the phone.
version: 4.5.3
homepage: https://tryvital.io/
repository: https://github.com/tryVital/vital-flutter
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.5.0"

flutter:
  plugin:
    platforms:
      ios:
        default_package: vital_devices_ios
      android:
        default_package: vital_devices_android

dependencies:
  flutter:
    sdk: flutter
  fimber: ^0.6.6
  vital_core:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_core/vital_core
  vital_devices_platform_interface:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_platform_interface
  vital_devices_android:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_android
  vital_devices_ios:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_ios
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  vital_core:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_core/vital_core
  vital_devices_platform_interface:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_platform_interface
  vital_devices_android:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_android
  vital_devices_ios:
    git:
      url: https://github.com/brancedev/vital-flutter.git
      ref: fastic_v3
      path: packages/vital_devices/vital_devices_ios
